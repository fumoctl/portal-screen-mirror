[package]
name = "portal-screen-mirror"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["fumoctl"]
description = "Compositor-agnostic Wayland screen, window, and region mirroring via XDG ScreenCast, wlr-screencopy, and layer-shell."
repository = "https://github.com/fumoctl/portal-screen-mirror"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5.5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.deb]
maintainer = "fumoctl"
section = "video"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/portal-screen-mirror", "usr/bin/", "755"],
    ["assets/portal-screen-mirror.desktop", "usr/share/applications/", "644"],
    ["assets/portal-screen-mirror.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/portal-screen-mirror", dest = "/usr/bin/portal-screen-mirror", mode = "755" },
    { source = "assets/portal-screen-mirror.desktop", dest = "/usr/share/applications/portal-screen-mirror.desktop", mode = "644" },
    { source = "assets/portal-screen-mirror.svg", dest = "/usr/share/icons/hicolor/scalable/apps/portal-screen-mirror.svg", mode = "644" },
]
